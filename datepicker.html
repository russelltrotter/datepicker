<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lodge Date Range Picker (Drop-in)</title>
  <link rel="stylesheet" href="datepicker.css" />
  <script defer src="datepicker.js"></script>
</head>

<body>
  <!-- ===============================
       DROP-IN WIDGET MARKUP
       =============================== -->
  <div class="ldr" data-ldr>
    <div class="ldr__fields">
      <label class="ldr__field">
        <span>Arrival</span>
        <input class="ldr__input" type="text" inputmode="none" readonly placeholder="Select date" data-ldr-start />
      </label>

      <label class="ldr__field">
        <span>Departure</span>
        <input class="ldr__input" type="text" inputmode="none" readonly placeholder="Select date" data-ldr-end />
      </label>

      <div class="ldr__meta" data-ldr-meta aria-live="polite"></div>

      <!-- hidden values you can submit in a form -->
      <input type="hidden" name="arrival" data-ldr-start-iso />
      <input type="hidden" name="departure" data-ldr-end-iso />
      <input type="hidden" name="nights" data-ldr-nights />
    </div>

    <div class="ldr__panel" data-ldr-panel hidden>
      <div class="ldr__header">
        <button type="button" class="ldr__nav" data-ldr-prev aria-label="Previous month">‹</button>
        <div class="ldr__title" data-ldr-title></div>
        <button type="button" class="ldr__nav" data-ldr-next aria-label="Next month">›</button>
      </div>

      <div class="ldr__calwrap" data-ldr-calwrap></div>

      <div class="ldr__actions">
        <button type="button" class="ldr__btn ldr__btn--ghost" data-ldr-clear>Clear</button>
        <button type="button" class="ldr__btn" data-ldr-close>Done</button>
      </div>
    </div>
  </div>
</body>
</html>
